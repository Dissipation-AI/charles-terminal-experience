name = "ctx-skills-4"
hypothesis = """
Round 4 (rounds 1-3 in bench/experiments/ctx-skills.md). v3 is v2 with every example made generic (v2's examples matched the benchmark's own tasks: "Console - ops", ./configure billing 9040, "Dev server - shop").
(a) v3 keeps v2's gains over ctx alone (round 3: 0.78x wall time [0.71, 0.91]), so they don't come from copying task-shaped examples.
(b) On two held-out tasks written after the skills (db-setup-wizard: prompts that depend on earlier output; kv-console: another slow, per-session console), the skills load and beat ctx alone.
(c) On round 1's tasks, where agy gets around the slow parts or needs no terminal (slow-load-inspect, postmortem-debug, sqlite-investigation, pick-up-task), they cost no more than ~10% time and tokens.
"""
reps = 3
jobs = 4
timeout = 900
seed = 4
tasks = ["ops-console", "warehouse-explore", "tab-dev-server", "dev-server", "interactive-wizard",
         "fix-failing-test", "multi-step-refactor", "debug-from-logs",
         "db-setup-wizard", "kv-console",
         "slow-load-inspect", "postmortem-debug", "sqlite-investigation", "pick-up-task"]

[agents.agy]
models = ["gemini-3.8-flash-high"]

[agents.claude]
models = ["sonnet"]

[agents.oracle]
models = ["solve.sh"]

[setups.ctx]
ctx = true


[setups.skills-v2]
ctx = true
plugins = ["bench/variants/ctx-skills-v2"]

[setups.skills-v3]
ctx = true
plugins = ["bench/variants/ctx-skills-v3"]

[ctx]
bin = "ctx/target/release"
repo = "ctx"
