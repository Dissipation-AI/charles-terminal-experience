workdir = "batch"
description = "Held out (written after v6). A full-screen dashboard (alternate screen, every field drawn at its own position; 8 s connect, fresh random jobs per session, 12 rows a page over 3 pages). ./jobs only relays a terminal to the scheduler, which draws the screen: finding the job takes reading screens and moving a selection with keys, then r and a y/N confirmation."
